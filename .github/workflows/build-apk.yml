name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: 🔐 Configure .env from GitHub Secrets
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}" >> .env
          fi

      - name: 🛡️ Setup Persistent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/debug.keystore" ]; then
            echo "Generating new persistent debug keystore..."
            keytool -genkey -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Using existing persistent debug keystore from repository."
          fi
          # Tell Gradle to use this keystore by putting it where it expects the default debug keystore
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: 🚀 Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 🔑 Output SHA-1 Certificate Fingerprint
        run: |
          echo "==================== ANDROID APK CERTIFICATE FINGERPRINTS ===================="
          keytool -list -v -keystore keystore/debug.keystore -alias androiddebugkey -storepass android -keypass android || true
          echo "============================================================================="
          echo "### 🔑 Android APK Certificate Info" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore keystore/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -iE "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Keystore Artifact (If newly generated)
        uses: actions/upload-artifact@v4
        with:
          name: KhelDeck-Keystore
          path: keystore/debug.keystore
          if-no-files-found: ignore

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhelDeck-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
